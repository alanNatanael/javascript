<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu progroma em Js</title>
    <style>
        body {
            background-color: rgb(57, 57, 255);
            color: white;
            font: normal 20pt Arial;
        }

        h1 {
            color: rgba(255, 166, 0, 0.8); 
        }
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1> 
    <p>já me livrei da maldição</p>

    <script> 
       var n1 = Number(window.prompt('Digite um número: ')) // string
       var n2 = Number(window.prompt('Digite outro número: ')) // string
       var s = n1 + n2 
       window.alert(`A soma entre ${n1} e ${n2} é igual a ${s}`) // sinal de (+) corresponde adição e concatenação
    </script>
</body>
</html>
